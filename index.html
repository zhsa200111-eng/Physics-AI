<script>
async function askAI() {
  const question = document.getElementById('question').value.trim();
  const answerBox = document.getElementById('answer');

  if (!question) {
    answerBox.innerText = 'Алдымен сұрақ енгізіңіз!';
    return;
  }

  answerBox.innerText = 'Жауап дайындалып жатыр...';

  try {
    const response = await fetch(
      'https://physics-ai-server.zhsa-2001-11.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          question: question
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Серверде қате пайда болды.');
    }

    answerBox.innerText = data.answer || 'Жауап алынбады.';

  } catch (error) {
    answerBox.innerText =
      'Қате: ' + error.message +
      '\nҚайталап көріңіз.';
  }
}
</script>
